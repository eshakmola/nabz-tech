[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perplexity-discover-scraper"
version = "1.4.0"
description = "Scrape Perplexity Discover and Google News RSS (images + text) with Scrapling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["scraping", "scrapling", "perplexity", "news", "playwright"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["scrapling[ai]>=0.5,<0.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
pdx-scrape = "perplexity_tech_scraper:main"
pdx-gnews = "gnews_scraper:main"
pdx-hub = "build_hub:main"

[project.urls]
Homepage = "https://github.com/USERNAME/perplexity-discover-scraper"

[tool.setuptools]
py-modules = ["perplexity_tech_scraper", "gnews_scraper", "build_hub"]

[tool.setuptools.packages.find]
include = ["pdx*", "gnews*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E741"]

[tool.coverage.run]
source = ["pdx", "gnews"]
