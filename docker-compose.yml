services:
  scraper:
    build: .
    image: perplexity-discover-scraper:local
    environment:
      # اگر لازم شد: PLAYWRIGHT_CHROMIUM_ARGS=--no-sandbox
      TZ: Asia/Tehran
    volumes:
      - ./output:/data/output
      - ./site:/data/site
    command: ["--category", "tech", "--out", "/data/output", "--site", "/data/site"]
    # مثال زمان‌بندی ساده (هر ۶ ساعت)
    restart: "no"
