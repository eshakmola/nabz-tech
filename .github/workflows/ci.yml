name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test deps only (no browser needed)
        run: |
          pip install pytest pytest-cov
          # pdx.parser / pdx.render are stdlib-only; scrapling is imported lazily.
          python -c "import pdx, pdx.hub, pdx.parser, pdx.render, gnews, gnews.feed, gnews.render"
      - name: Run unit tests
        run: pytest --cov=pdx --cov=gnews --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke-scrape:
    name: Live smoke scrape
    # Only on demand / on main pushes: needs Chromium and hits the real site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + browsers
        run: |
          pip install -e ".[dev]"
          scrapling install

      - name: Scrape 3 articles (no images)
        run: |
          python perplexity_tech_scraper.py --limit 3 --no-images --min-items 1 \
            --out smoke --quiet
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("smoke/perplexity_tech.json").read_text("utf-8"))
          print("items:", data["count"])
          assert data["count"] >= 1, "scraper returned no items"
          first = data["items"][0]
          for key in ("title", "url", "summary", "report_sections", "sources_count"):
              assert key in first, f"missing field {key}"
          assert first["report_sections"], "empty report"
          print("first:", first["title"])
          PY

      - name: Verify CLI re-render path
        run: python perplexity_tech_scraper.py --from-json smoke/perplexity_tech.json --out smoke2 --quiet

      - name: Hub smoke (build the 3-way page from scratch data)
        run: |
          python build_hub.py --perplexity smoke/perplexity_tech.json \
                              --gnews smoke-gnews/gnews.json \
                              --out site/index.html
          python - <<'PY'
          import re, json, pathlib
          html = pathlib.Path("site/index.html").read_text("utf-8")
          payload = json.loads(re.search(r"window\.__HUB__ = (\[.*?\]);</script>", html, re.S).group(1))
          assert any(e["source"] == "perplexity" for e in payload)
          assert len(re.findall(r'data-src="(all|perplexity|gnews)"', html)) == 3
          print("hub ok:", len(payload), "entries")
          PY

      - name: Google News smoke (3 items, no publisher fetch)
        run: |
          python gnews_scraper.py --limit 3 --out smoke-gnews --quiet
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("smoke-gnews/gnews.json").read_text("utf-8"))
          assert data["count"] == 3, data["count"]
          first = data["items"][0]
          assert first["title"] and first["url"]
          assert first["related_links"], "description links were not parsed"
          print("gnews ok:", first["title"][:60], "| resolved:", bool(first["resolved_url"]))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: smoke-output
          path: smoke/
          retention-days: 3
