name: Publish hub (GitHub Pages + Cloudflare KV)

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'site/**']
  schedule:
    - cron: '15 * * * *'       # هر ۱ ساعت (UTC) — دقیقه ۱۵ تا با کران کلادفلر تلاقی نکند
  workflow_dispatch:
    inputs:
      perplexity_limit:
        description: 'تعداد خبر Perplexity'
        default: '8'
      gnews_limit:
        description: 'تعداد خبر Google News'
        default: '8'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERPLEXITY_LIMIT: ${{ inputs.perplexity_limit || '8' }}
      GNEWS_LIMIT: ${{ inputs.gnews_limit || '8' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (browser needed for the Perplexity side)
        continue-on-error: true
        run: |
          python -m playwright install --with-deps chromium || scrapling install

      - name: Scrape Perplexity
        continue-on-error: true
        run: |
          python perplexity_tech_scraper.py --category tech --limit "$PERPLEXITY_LIMIT" \
            --out output --min-items 1 --quiet || true

      - name: Scrape Google News
        continue-on-error: true
        run: |
          python gnews_scraper.py --limit "$GNEWS_LIMIT" --out output --min-items 1 --quiet || true

      - name: Build hub page (All / Perplexity / G News)
        run: |
          python build_hub.py --dir output --out docs/index.html --no-archive || true
          python build_hub.py --dir output --out site/index.html --no-archive || true

      - name: Publish combined JSON for the API
        run: |
          python scripts/publish_data.py --dir output --out data

      - name: Push data to Cloudflare KV
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CF_KV_NAMESPACE != '' }}
        run: |
          python scripts/publish_data.py --dir output --out data \
            --kv --namespace "$CF_KV_NAMESPACE" --account "$CLOUDFLARE_ACCOUNT_ID"

      - name: Commit refreshed data + site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site docs
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi


  # Pages از شاخه‌ی main و پوشه‌ی /docs سرو می‌شود، پس کامیت بالا به‌تنهایی
  # سایت را به‌روز می‌کند و نیازی به actions/deploy-pages نیست.

  deploy-worker:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy Cloudflare Worker (API + web + hourly cron)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # KV: اگر از قبل هست دوباره استفاده می‌شود، وگرنه ساخته می‌شود
          KV_ID="${{ secrets.CF_KV_NAMESPACE }}"
          if [ -z "$KV_ID" ]; then
            KV_ID=$(npx --yes wrangler@3 kv namespace list 2>/dev/null \
              | python3 -c "import json,sys;ns=json.load(sys.stdin);print(next((n['id'] for n in ns if n['title'] in ('HUB','nabz-worker-HUB')),''))" || true)
          fi
          if [ -z "$KV_ID" ]; then
            OUT=$(npx --yes wrangler@3 kv namespace create HUB 2>&1 || true); echo "$OUT"
            KV_ID=$(echo "$OUT" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          fi
          if [ -n "$KV_ID" ]; then python3 wire-kv.py "$KV_ID"; fi
          npx --yes wrangler@3 deploy --compatibility-date=2024-11-01
